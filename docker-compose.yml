services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: omni-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: omni
    ports:
      - "5434:5432"
    volumes:
      - omni-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d omni"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  omni-pgdata:
